[INCLUDES]

before = common.conf

[Definition]

# Nginx Proxy Manager access log filter - Sensitive Files Access
# NPM access log format:
# [09/Aug/2026:03:22:50 +0000] 404 - GET http 155.248.230.163 "/.env" [Client 78.153.140.39] ...

# Block .env, .git, sensitive files, WordPress, PHP exploits, directory traversal
failregex = ".*\.env.*" \[Client <HOST>\]
            ".*\.git.*" \[Client <HOST>\]
            ".*\.htaccess.*" \[Client <HOST>\]
            ".*\.htpasswd.*" \[Client <HOST>\]
            ".*config\.php.*" \[Client <HOST>\]
            ".*wp-login.*" \[Client <HOST>\]
            ".*wp-admin.*" \[Client <HOST>\]
            ".*wp-config.*" \[Client <HOST>\]
            ".*wp-content.*" \[Client <HOST>\]
            "/wp/.*" \[Client <HOST>\]
            "/wordpress/.*" \[Client <HOST>\]
            "/blog/wp-.*" \[Client <HOST>\]
            ".*xmlrpc\.php.*" \[Client <HOST>\]
            ".*phpunit.*" \[Client <HOST>\]
            ".*composer.*" \[Client <HOST>\]
            ".*laravel.*" \[Client <HOST>\]
            ".*vendor.*" \[Client <HOST>\]
            ".*eval-stdin\.php.*" \[Client <HOST>\]
            ".*\.\..*" \[Client <HOST>\]

# IGNORE: Allow legitimate webhook endpoints (any successful POST to webhook)
ignoreregex = ^\[.*?\] - 200 200 - POST .* ".*\/smn-webhook.*"
            ^\[.*?\] - 200 200 - POST .* ".*\/webhook.*"

datepattern = {^LN-BEG}%%ExY(?P<_sep>[-/.])%%m(?P=_sep)%%d[T ]%%H:%%M:%%S(?:[.,]%%f)?(?:\s*%%z)?