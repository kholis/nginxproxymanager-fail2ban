[INCLUDES]

before = common.conf

[Definition]

# Nginx Proxy Manager error log format (standard nginx error log):
# 2026/08/12 04:03:37 [error] 7038#7038: *4217106 open() "/var/www/html/.env" failed (2: No such file or directory), client: 43.167.173.44, server: localhost-nginx-proxy-manager, request: "GET /.env HTTP/1.1", host: "155.248.230.163:80"

# Match attempts to access sensitive files (.env, .git, etc.)
# Match directory traversal attempts (/../, /etc/, /var/, /usr/, /boot/, /proc/, /sys/)
# Match common RCE/exploit paths (phpunit, xmlrpc, wp-*, etc.)
failregex = client: <HOST>, .*?request: ".+? /(?:\.(?:env|git|svn|htaccess|htpasswd)|vendor|composer|phpunit|laravel|wp-|xmlrpc|eval-stdin\.php|admin\.php|install\.php) .+?", host:
            client: <HOST>, .*?request: ".+? /(?:\.\.|etc|var|usr|boot|proc|sys|root|home|tmp)(?:/|$) .+?", host:
            client: <HOST>, .*?request: ".+? /\.php\? .+?", host:

ignoreregex =