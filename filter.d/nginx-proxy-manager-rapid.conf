[INCLUDES]

before = common.conf

[Definition]

# Nginx Proxy Manager filter - Rapid Access / Bot Scanner Detection
# Catches IPs making too many requests in a short time period

# Match any access line with client IP
failregex = \[Client <HOST>\]

# IGNORE: Allow legitimate webhook endpoints
ignoreregex = ^\[.*?\] - 200 200 - POST .* ".*\/smn-webhook.*"
            ^\[.*?\] - 200 200 - POST .* ".*\/webhook.*"

datepattern = {^LN-BEG}%%ExY(?P<_sep>[-/.])%%m(?P=_sep)%%d[T ]%%H:%%M:%%S(?:[.,]%%f)?(?:\s*%%z)?